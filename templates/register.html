{% extends "base.html" %}
{% block title %}Register | HeartCare AI{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="card auth-copy">
        <p class="eyebrow">Create User Account</p>
        <h1>Register before predicting.</h1>
        <p class="lead">
            Enter your full name, email, phone number, and password to unlock the prediction dashboard.
        </p>
    </div>

    <form class="card auth-form" method="post">
        <label>Full Name
            <input type="text" name="full_name" placeholder="Enter your full name" required>
        </label>
        <label>Email
            <input type="email" name="email" placeholder="Enter your email" required>
        </label>
        <label>Phone Number
            <input type="text" name="phone" placeholder="Enter your phone number" required>
        </label>
        <label>Password
            <input type="password" name="password" placeholder="Create a password" required>
        </label>
        <label>Confirm Password
            <input type="password" name="confirm_password" placeholder="Re-enter your password" required>
        </label>
        <button class="button primary full" type="submit">Register</button>
    </form>
</section>
{% endblock %}
